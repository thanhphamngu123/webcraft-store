<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCraft Store - Chợ Mua Bán & Trải Nghiệm Template Website Multi-File</title>
  <meta name="description" content="Nền tảng trải nghiệm và xem trước các trang web chất lượng cao.">
  <link rel="stylesheet" href="styles.css">
  
  <!-- JSZip Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Firebase SDK Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head>
<body>

  <!-- Clean Public Top Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <span class="brand-gradient">WebCraft Store</span>
    </a>

    <!-- Clean Customer Nav Actions -->
    <div class="nav-actions">
      <span style="font-size:0.85rem; color:var(--text-secondary); font-weight:600;">
        Khám Phá & Trải Nghiệm Giao Diện Website
      </span>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-bg-glow"></div>
    <div class="hero-content">
      <div class="hero-pill">Powered by Firebase Cloud Database</div>
      <h1 class="hero-title">Khám Phá Các Mẫu Website Đẳng Cấp</h1>
      <p class="hero-subtitle">
        Trải nghiệm Live Demo trực tiếp các dự án website đa trang đa dạng (SaaS, Nhà Hàng, Portfolio, Thương Mại...).
      </p>
    </div>
  </section>

  <!-- Search & Filter Controls -->
  <div class="controls-bar">
    <div class="search-box-wrap">
      <input type="text" id="search-input" class="search-input" style="padding-left:1.25rem;" placeholder="Tìm kiếm trang web theo tên hoặc danh mục...">
    </div>

    <div class="filter-row">
      <div class="category-pills" id="category-pills-container">
        <!-- Rendered dynamically by app.js -->
      </div>

      <span class="catalog-counter" id="template-count">0 Giao Diện Mẫu</span>
    </div>
  </div>

  <!-- Marketplace Product Grid -->
  <main class="grid-container" id="marketplace-grid">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Live Demo Fullscreen Viewer Modal -->
  <div class="modal-overlay" id="live-demo-modal">
    <div class="demo-modal-container">
      <div class="demo-topbar">
        <div class="demo-info">
          <button class="close-demo-btn" onclick="App.closeLiveDemo()">
            Thoát Demo
          </button>
          <span class="demo-title-text" id="demo-title">Template Name</span>
          <span id="demo-page-indicator" class="page-indicator-badge">index.html</span>
        </div>

        <div class="device-switcher">
          <button class="device-btn active" data-device="desktop">
            Desktop
          </button>
          <button class="device-btn" data-device="tablet">
            Tablet
          </button>
          <button class="device-btn" data-device="mobile">
            Mobile
          </button>
        </div>

        <div class="demo-topbar-actions">
          <button class="newtab-btn" onclick="App.openInNewTab()">
            Mở Tab Mới
          </button>
        </div>
      </div>

      <div class="sandbox-stage">
        <div class="iframe-wrapper device-desktop" id="iframe-wrapper">
          <iframe id="demo-iframe" class="sandbox-iframe" title="Live Preview Sandbox"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Info Drawer Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="admin-modal-container" style="max-width: 650px; height: auto; max-height: 85vh;">
      <div class="admin-header">
        <h2 id="detail-title">Detail Title</h2>
        <button class="close-btn" onclick="App.closeDetailModal()">&times;</button>
      </div>
      <div style="padding: 2rem; overflow-y: auto;">
        <img id="detail-img" src="" alt="Preview" style="width:100%; height:260px; object-fit:cover; border-radius:12px; margin-bottom:1.5rem;">
        <p id="detail-desc" style="color:var(--text-secondary); line-height:1.6; margin-bottom:2rem;"></p>
        
        <div style="display:flex; justify-content:flex-end;">
          <button class="demo-btn-primary" id="detail-demo-btn" style="padding:0.75rem 2rem;">Xem Live Demo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/sandbox.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
