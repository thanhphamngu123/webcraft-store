<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCraft Store - Giao Diện Website Chất Lượng Cao</title>
  <meta name="description" content="Nền tảng trải nghiệm và xem trước các trang web chất lượng cao.">
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <!-- JSZip Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Firebase SDK Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head>
<body>

  <!-- Frolax Style Premium Showcase Hero Section (contains frolax-topbar as navbar inside) -->
  <section class="frolax-hero-wrapper">
    <!-- Top Navigation Header inside Hero Wrapper -->
    <header class="frolax-topbar">
      <div class="frolax-brand">
        <div class="frolax-logo-emblem"></div>
        <span class="frolax-brand-name">WebCraft Store</span>
      </div>

      <nav class="frolax-nav-pill">
        <span class="frolax-nav-link active">About</span>
        <span class="frolax-nav-link">Shop</span>
        <span class="frolax-nav-link">Contact</span>
      </nav>
    </header>

    <!-- Main Hero Banner Body -->
    <div class="frolax-hero-body">
      <!-- Left Column: Headline & Video Card -->
      <div class="frolax-left-col">
        <h1 class="frolax-headline">ELEVATE<br>YOUR SELF</h1>

        <div class="frolax-video-card">
          <img src="https://images.unsplash.com/photo-1573855619003-97b4799dcd8b?auto=format&fit=crop&w=500&q=80"
            alt="Video Preview" class="frolax-video-thumb">
          <button class="frolax-play-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFF">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Center Column: Model Holding Bags -->
      <div class="frolax-center-col">
        <img src="https://images.unsplash.com/photo-1588117305388-c2631a279f82?auto=format&fit=crop&w=900&q=80"
          alt="Model" class="frolax-model-img">
      </div>

      <!-- Right Column: Avatar Stack, Rating, Subtext, CTA -->
      <div class="frolax-right-col">
        <div class="frolax-avatar-row">
          <div class="frolax-avatar-stack">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80"
              class="frolax-avatar">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80"
              class="frolax-avatar">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=80"
              class="frolax-avatar">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80"
              class="frolax-avatar">
          </div>
          <span class="frolax-count-badge">+27K</span>
        </div>

        <div class="frolax-rating-text">
          4.8 <span class="rating-link">( 15K rating )</span>
        </div>

        <p class="frolax-subtext">
          Assurance in every layer, with trusted comfort. Our quality ensures satisfaction and peace.
        </p>

        <button class="frolax-cta-btn">
          Shop Now
        </button>
      </div>
    </div>
  </section>

  <!-- Search & Filter Controls -->
  <div class="controls-bar">
    <div class="search-box-wrap">
      <input type="text" id="search-input" class="search-input"
        placeholder="Tìm kiếm trang web theo tên hoặc danh mục...">
    </div>

    <div class="filter-row">
      <div class="category-pills" id="category-pills-container">
        <!-- Rendered dynamically by app.js -->
      </div>

      <span class="catalog-counter" id="template-count">0 Giao Diện Mẫu</span>
    </div>
  </div>

  <!-- Marketplace Product Grid -->
  <main class="grid-container" id="marketplace-grid">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Live Demo Fullscreen Viewer Modal -->
  <div class="modal-overlay" id="live-demo-modal">
    <div class="demo-modal-container">
      <div class="demo-topbar">
        <div class="demo-info">
          <button class="close-demo-btn" onclick="App.closeLiveDemo()">
            Thoát Demo
          </button>
          <span class="demo-title-text" id="demo-title">Template Name</span>
          <span id="demo-page-indicator" class="page-indicator-badge">index.html</span>
        </div>

        <div class="device-switcher">
          <button class="device-btn active" data-device="desktop">
            Desktop
          </button>
          <button class="device-btn" data-device="tablet">
            Tablet
          </button>
          <button class="device-btn" data-device="mobile">
            Mobile
          </button>
        </div>

        <div class="demo-topbar-actions">
          <button class="newtab-btn" onclick="App.openInNewTab()">
            Mở Tab Mới
          </button>
        </div>
      </div>

      <div class="sandbox-stage">
        <div class="iframe-wrapper device-desktop" id="iframe-wrapper">
          <iframe id="demo-iframe" class="sandbox-iframe" title="Live Preview Sandbox"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Info Drawer Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="admin-modal-container" style="max-width: 650px; height: auto; max-height: 85vh;">
      <div class="admin-header">
        <h2 id="detail-title">Detail Title</h2>
        <button class="close-btn" onclick="App.closeDetailModal()">&times;</button>
      </div>
      <div style="padding: 2rem; overflow-y: auto;">
        <img id="detail-img" src="" alt="Preview"
          style="width:100%; height:260px; object-fit:cover; border-radius:12px; margin-bottom:1.5rem;">
        <p id="detail-desc" style="color:var(--text-secondary); line-height:1.6; margin-bottom:2rem;"></p>

        <div style="display:flex; justify-content:flex-end;">
          <button class="demo-btn-primary" id="detail-demo-btn" style="padding:0.75rem 2rem;">Xem Live Demo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/sandbox.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
